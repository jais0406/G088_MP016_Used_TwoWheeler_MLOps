# MP016 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G088"          # your group id, e.g. "G042"
problem_id: "MP016"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: final_price_from_rc_transfer           # the column that must not be used as a feature
  unit_mixup:
    present: false
    column: null           # the column recorded in a different unit
    group_value: null      # the value of city_zone whose rows are affected
    factor: null           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: accidents
    value: -999            # the special number typed instead of a blank
    count: 68            # how many rows have it
  duplicate_rows:
    present: true
    count: 36            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: engine_cc
    start_date: "2026-03-23"       # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-04-13"         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: false
    count: null            # rows whose target was typed 10 times too big
  spelling_variants:
    present: false
    column: null
    true_levels: null      # how many real categories there are after cleaning

tracking:
  experiment_name: "mp016-resale"
  best_run_id: "112d44c4790445d99875ebe07de44e0b"        # the MLflow run id of your v1 model
  registered_model_name: null
  champion_version: null

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    age_years: null
    km_driven: null
    engine_cc: null
    owners: null
    service_records: null
    accidents: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of city_zone
    'North': null
    'South': null
    'Central': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
