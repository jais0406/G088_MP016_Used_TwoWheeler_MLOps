data:
  raw_train: data/raw/train.csv
  raw_later: data/raw/later.csv
  raw_holdout: data/raw/holdout_features.csv
  clean_train: data/processed/train_clean.csv
target: resale_thousand_rs
leak_columns: [final_price_from_rc_transfer]
numeric_features: [age_years, km_driven, engine_cc, owners, service_records, accidents]
categorical_features: [brand_tier, city_zone]
group_column: city_zone
checks:
  sentinel_candidates: [-999, -99, -1, 999, 9999]
  stuck_min_run_days: 7
  typo_factor: 10
train:
  experiment_name: mp016-resale
  tracking_uri: sqlite:///mlflow.db
  model_dir: models
  model_path: models/model.joblib
  info_path: models/v1_info.json
  findings_path: findings.yaml
  cv_folds: 5
  random_state: 42
  scoring: neg_mean_absolute_error
  models:
    Ridge:
      alpha: [0.1, 1.0, 10.0]
    RandomForestRegressor:
      n_estimators: [50, 100]
      max_depth: [5, 10]
    GradientBoostingRegressor:
      n_estimators: [50, 100]
      learning_rate: [0.05, 0.1]
retrain:
  registered_model_name: mp016-resale-model
  threshold_ratio: 0.88
  split_ratio: 0.7
  comparison_path: models/comparison.json
  v1_archive_path: models/model_v1.joblib
holdout:
  holdout_path: data/raw/holdout_features.csv
  predictions_path: predictions/holdout_predictions.csv



